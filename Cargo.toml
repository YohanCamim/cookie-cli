[package]
name = "cookie-cli"
version = "1.0.0"
edition = "2021"
description = "Full-featured terminal Cookie Clicker built with ratatui and crossterm"
authors = ["Cookie-CLI Contributors"]
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0"
rand = { version = "0.8", features = ["small_rng"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
